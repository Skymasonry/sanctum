name: Deploy Sanctum

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to sanctum.skymasons.xyz
        run: |
          echo "${{ secrets.SANCTUM_DEPLOY_KEY }}" > /tmp/sanctum_deploy_key
          chmod 600 /tmp/sanctum_deploy_key
          ssh -i /tmp/sanctum_deploy_key \
            -o StrictHostKeyChecking=no \
            grandmaster@${{ secrets.NEO_HOST }}
          rm /tmp/sanctum_deploy_key
