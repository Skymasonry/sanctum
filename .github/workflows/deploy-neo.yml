name: Deploy Neo

on:
  push:
    branches: [neo]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fix cache permissions
        run: |
          echo "${{ secrets.NEO_DEPLOY_KEY }}" > /tmp/neo_deploy_key
          chmod 600 /tmp/neo_deploy_key
          ssh -i /tmp/neo_deploy_key \
            -o StrictHostKeyChecking=no \
            grandmaster@${{ secrets.NEO_HOST }} \
            "docker exec sanctum-neo-dev-1 sh -c 'chmod -R 777 /app/.next/cache 2>/dev/null; rm -rf /app/.next/cache 2>/dev/null' || true"
          rm /tmp/neo_deploy_key

      - name: Deploy to neo.skymasons.xyz
        run: |
          echo "${{ secrets.NEO_DEPLOY_KEY }}" > /tmp/neo_deploy_key
          chmod 600 /tmp/neo_deploy_key
          ssh -i /tmp/neo_deploy_key \
            -o StrictHostKeyChecking=no \
            grandmaster@${{ secrets.NEO_HOST }} \
            "bash /home/grandmaster/deploy-neo.sh"
          rm /tmp/neo_deploy_key
