services:
  app:
    image: node:20-alpine
    working_dir: /app
    command: node server.js
    ports:
      - "3001:3000"
    volumes:
      - ./.next/standalone:/app
      - ./.next/static:/app/.next/static
      - ./public:/app/public
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXTCLOUD_INTERNAL_URL=http://nextcloud:80
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - caddy_default
      - nextcloud_nextcloud_network

  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "node_modules/.bin/next dev -p 3000"
    ports:
      - "3002:3000"
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXTCLOUD_INTERNAL_URL=http://nextcloud:80
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - caddy_default
      - nextcloud_nextcloud_network

  hocus:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci --omit=dev --no-audit --no-fund && node server.mjs"
    volumes:
      - ./hocus:/app
    env_file:
      - .env
    environment:
      - PORT=3003
    restart: unless-stopped
    networks:
      - caddy_default
      - nextcloud_nextcloud_network

networks:
  caddy_default:
    external: true
  nextcloud_nextcloud_network:
    external: true
